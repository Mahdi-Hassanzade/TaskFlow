<!DOCTYPE html><html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>Update Task</title>
    <link rel="stylesheet" href="{% static 'css/add.css' %}">
</head>
<body>
<div class="add-container">
    <div class="add-header">
        <h1>Update Task</h1>
        <p>Edit your task</p>
    </div><div class="add-card">

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Title</label>
            {{ form.title }}
        </div>

        <div class="form-group">
            <label>Description</label>
            {{ form.description }}
        </div>

        <div class="form-group">
            <label>Status</label>
            {{ form.status }}
        </div>

        <div class="form-group">
            <label>Priority</label>
            {{ form.priority }}
        </div>
        <div class="form-buttons">
            <button type="submit" class="btn-submit">delete</button>

            <a href="index.html" class="btn-cancel">Cancel</a>

        </div>
    </form>
</div>

</div>
</body>
</html>
